# Resolve php-app through Docker's embedded DNS at request time and re-check it
# periodically. Without this, nginx caches the container IP at startup and a
# `docker compose up` that recreates php-app leaves nginx pointing at a dead
# address, producing 502s until nginx is restarted manually.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream php_backend {
    zone php_backend 64k;
    server php-app:9000 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel's built-in health route is served by PHP, so it must be handed to
    # php-fpm over FastCGI. proxy_pass talks HTTP and resets the connection
    # because php-fpm speaks FastCGI on 9000.
    location = /up {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /up;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass php_backend;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }

    # API first: everything under /v1 goes to Laravel.
    location /v1/ {
        try_files $uri /index.php?$query_string;
    }

    # Built SPA (npm/pnpm build output copied into the image). Serving it from
    # the same origin as /v1 means the browser needs no CORS in this mode.
    location / {
        root /usr/share/nginx/html;
        # `$uri/` would match the directory itself and nginx then refuses the
        # directory index, so SPA routes must fall through to index.html.
        try_files $uri /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_read_timeout 90s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Regex locations take precedence over the prefix `/assets/` block, so this
    # must point at the SPA root; otherwise every built JS/CSS chunk 404s.
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
