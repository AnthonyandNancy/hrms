name: factoryhr

x-app-common: &app-common
  build:
    context: ../..
    dockerfile: deploy/docker/php.Dockerfile
    target: runtime
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
  image: factoryhr/php-app:${RELEASE_TAG:-v11-0677576}
  restart: unless-stopped
  env_file:
    - path: ../../backend/.env
      required: false
  environment:
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    # Must match the nginx published port, not the host php artisan serve port.
    # A mismatched APP_URL breaks generated download links (export downloads,
    # short-lived file URLs) because they are absolute.
    APP_URL: ${APP_URL:-http://localhost:${HTTP_PORT:-5174}}
    APP_TIMEZONE: UTC
    # The SPA is served separately (dev server or static host). Browser requests
    # are credentialed, so origins must be explicit and never "*".
    HRMS_CORS_ALLOWED_ORIGINS: ${HRMS_CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
    # Pin the login throttle explicitly. Without this the container inherits
    # backend/.env, where a developer may have raised it for local E2E runs,
    # silently weakening brute-force protection in a deployed stack.
    IAM_LOGIN_RATE_LIMIT_PER_MINUTE: ${IAM_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
    # Demo seeding needs the same password as the installer. It is injected
    # only for demo bring-up and never committed.
    DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-factoryhr}
    DB_USERNAME: ${DB_USERNAME:-factoryhr}
    DB_PASSWORD: ${DB_PASSWORD:-change-me}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    FILESYSTEM_DISK: s3
    AWS_ENDPOINT: http://minio:9000
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-factoryhr}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
    AWS_BUCKET: ${AWS_BUCKET:-factoryhr-private}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  volumes:
    - app-storage:/var/www/html/backend/storage
    # nginx runs a different image, so the SPA built into this image is
    # published to a shared volume that nginx mounts read-only.
  networks:
    - backend
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  nginx:
    # Reuses the same image so the built SPA is present at
    # /var/www/html/frontend/dist without a cross-image volume.
    build:
      context: ../..
      dockerfile: deploy/docker/php.Dockerfile
      target: frontend-runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: factoryhr/frontend:${RELEASE_TAG:-v11-0677576}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-5174}:80"
    volumes:
      - ../../backend/public:/var/www/html/backend/public:ro
      - ../docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-app:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  php-app:
    <<: *app-common
    # Publish the SPA once (idempotent) before starting php-fpm.
    command: ["php-fpm", "--nodaemonize"]

  php-worker:
    <<: *app-common
    command: ["php", "backend/artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=90"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Serialise volume initialisation: all three PHP services mount the same
      # app-storage volume, and Docker fails the race with
      # "mkdir ... file exists" if they start simultaneously.
      php-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]

  php-scheduler:
    <<: *app-common
    command: ["php", "backend/artisan", "schedule:work"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      php-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      # Placeholders only. Provide real values via the shell or an untracked
      # deploy/compose/.env file; never commit production secrets.
      MYSQL_DATABASE: ${DB_DATABASE:-factoryhr}
      MYSQL_USER: ${DB_USERNAME:-factoryhr}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # Pinned release tags are no longer anonymously pullable from Docker Hub
    # (pull access denied). Override MINIO_IMAGE to pin a verified digest in a
    # real environment; the default keeps the reference stack runnable.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-factoryhr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot init container: creates the private bucket so the application's
  # storage health check passes on a fresh `docker compose up`. Without it the
  # bucket must be created by hand and /v1/health reports storage=false.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-factoryhr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      AWS_BUCKET: ${AWS_BUCKET:-factoryhr-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_BUCKET" &&
        mc anonymous set none "local/$$AWS_BUCKET" &&
        echo "bucket ready: $$AWS_BUCKET"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  app-storage:
  mysql-data:
  redis-data:
  minio-data:
