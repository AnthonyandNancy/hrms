        template: { type: string, enum: [SELF, MANAGED, ORG_UNIT, ORG_SUBTREE, COMPANY, CASE, PAYROLL_RUN] }
        anchor_type: { type: string, enum: [SELF, MANAGED, ORG_UNIT, ORG_SUBTREE, COMPANY, CASE, PAYROLL_RUN] }
        label: { type: string }
        active: { type: boolean }
        sort_order: { type: integer, minimum: 0 }
        description: { type: string }
    FieldPolicy:
      type: object
      required: [field_key, profile, declared_profile, can_tighten]
      properties:
        field_key: { type: string }
        profile: { type: string, enum: [P0_PUBLIC, P1_INTERNAL, P2_SENSITIVE, P3_RESTRICTED] }
        declared_profile: { type: string, enum: [P0_PUBLIC, P1_INTERNAL, P2_SENSITIVE, P3_RESTRICTED] }
        can_tighten: { type: boolean }
    DictionaryEntry:
      type: object
      required: [id, type, code, label, sort_order, active]
      properties:
        id: { type: integer }
        type: { type: string }
        code: { type: string }
        label: { type: string }
        sort_order: { type: integer, minimum: 0 }
        active: { type: boolean }
    SystemParameter:
      type: object
      required: [id, key, scope, value, sensitive, masked]
      properties:
        id: { type: integer }
        key: { type: string }
        scope: { type: string }
        value: {}
        sensitive: { type: boolean }
        masked: { type: boolean }
    NotificationTemplate:
      type: object
      required: [id, code, channel, subject, body, version, active]
      properties:
        id: { type: integer }
        code: { type: string }
        channel: { type: string, enum: [IN_APP, EMAIL, WECHAT_WORK] }
        subject: { type: string }
        body: { type: string }
        version: { type: integer, minimum: 1 }
        active: { type: boolean }
    NotificationDelivery:
      type: object
      required: [id, delivery_id, template_code, recipient_user_id, channel, status, attempts, last_error, sent_at]
      properties:
        id: { type: integer }
        delivery_id: { type: integer }
        template_code: { type: string }
        recipient_user_id: { type: integer }
        channel: { type: string, enum: [IN_APP, EMAIL, WECHAT_WORK] }
        status: { type: string, enum: [PENDING, SENT, FAILED] }
        attempts: { type: integer, minimum: 0 }
        last_error: { type: [string, 'null'] }
        sent_at: { type: [string, 'null'], format: date-time }
    CalendarVersion:
      type: object
      required: [version, timezone, workweek, standard_day_minutes, holidays]
      properties:
        version: { type: integer, minimum: 1 }
        timezone: { type: string }
        workweek:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
        standard_day_minutes: { type: integer, minimum: 1, maximum: 1440 }
        holidays:
          type: array
          items:
            type: object
            required: [date, name, type]
            properties:
              date: { type: string, format: date }
              name: { type: string }
              type: { type: string, enum: [PUBLIC, COMPANY, MAKEUP] }
    RoleCapabilitySelection:
      type: object
      required: [capability, anchor_type, field_profile]
      properties:
        capability: { type: string }
        anchor_type: { type: string }
        field_profile: { type: string, enum: [P0_PUBLIC, P1_INTERNAL, P2_SENSITIVE, P3_RESTRICTED] }
    RoleCreateRequest:
      type: object
      required: [code, name, purpose, capabilities]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 120 }
        purpose: { type: string, minLength: 8, maxLength: 255 }
        expires_at: { type: [string, 'null'], format: date-time }
        capabilities:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/RoleCapabilitySelection"
    RoleCopyRequest:
      type: object
      required: [code, name, purpose]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 120 }
        purpose: { type: string, minLength: 8, maxLength: 255 }
    RoleAuthorizationRequest:
      type: object
      required: [pages, capabilities]
      properties:
        pages:
          type: array
          maxItems: 160
          items:
            type: string
        capabilities:
          type: array
          maxItems: 512
          items:
            type: object
            required: [capability, anchor_type, field_profile]
            properties:
              capability:
                type: string
              anchor_type:
                type: string
                enum: [SELF, MANAGED, ORG_UNIT, ORG_SUBTREE, COMPANY, CASE, PAYROLL_RUN]
              field_profile:
                type: string
                enum: [P0_PUBLIC, P1_INTERNAL, P2_SENSITIVE, P3_RESTRICTED]
              page_code:
                type: string
                description: Required when the capability is a page action.
        expected_version:
          type: integer
          minimum: 1
          description: Required by new clients; stale values return 409 ROLE_AUTHORIZATION_VERSION_CONFLICT.
        reason:
          type: [string, "null"]
          maxLength: 255
    RoleCapabilitiesRequest:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/RoleCapabilitySelection"
    MenuOverrideCreateRequest:
      type: object
      required: [page_code]
      properties:
        page_code: { type: string }
        label: { type: [string, 'null'] }
        visible: { type: boolean }
        sort_order: { type: integer, minimum: 0 }
    MenuOverrideUpdateRequest:
      type: object
      properties:
        label: { type: [string, 'null'] }
        visible: { type: boolean }
        sort_order: { type: integer, minimum: 0 }
    DataScopePolicyUpdateRequest:
      type: object
      properties:
        label: { type: string }
        anchor_type: { type: string }
        active: { type: boolean }
        sort_order: { type: integer, minimum: 0 }
    FieldPolicyUpdateRequest:
      type: object
      required: [field_profile]
      properties:
        field_profile: { type: string, enum: [P0_PUBLIC, P1_INTERNAL, P2_SENSITIVE, P3_RESTRICTED] }
    DictionaryCreateRequest:
      type: object
      required: [type, code, label]
      properties:
        type: { type: string }
        code: { type: string }
        label: { type: string }
        sort_order: { type: integer, minimum: 0 }
        active: { type: boolean }
    DictionaryUpdateRequest:
      type: object
      properties:
        label: { type: string }
        sort_order: { type: integer, minimum: 0 }
        active: { type: boolean }
    SystemParameterUpdateRequest:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        scope: { type: string }
        value: {}
        sensitive: { type: boolean }
    CalendarPublishRequest:
      type: object
      required: [timezone, workweek]
      properties:
        timezone: { type: string }
        workweek:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
        standard_day_minutes: { type: integer, minimum: 1, maximum: 1440 }
        holidays:
          type: array
          maxItems: 500
          items:
            type: object
            required: [date, name, type]
            properties:
              date: { type: string, format: date }
              name: { type: string }
              type: { type: string, enum: [PUBLIC, COMPANY, MAKEUP] }
    NotificationTemplateCreateRequest:
      type: object
      required: [code, channel, subject, body]
      properties:
        code: { type: string }
        channel: { type: string, enum: [IN_APP, EMAIL, WECHAT_WORK] }
        subject: { type: string }
        body: { type: string }
    NotificationDispatchRequest:
      type: object
      required: [event_key, template_code, recipient_user_id]
      properties:
        event_key: { type: string }
        template_code: { type: string }
        recipient_user_id: { type: integer, minimum: 1 }
        variables:
          type: object
          additionalProperties: true
    DictionaryProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DictionaryEntry"
    DataScopeProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DataScopePolicy"
    FieldPolicyProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FieldPolicy"
    MenuOverrideProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MenuOverride"
    SystemParameterProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SystemParameter"
    NotificationTemplateProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NotificationTemplate"
    NotificationDeliveryProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NotificationDelivery"

    BenefitPlan:
      type: object
      required:
