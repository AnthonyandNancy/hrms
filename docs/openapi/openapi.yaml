        employee_rate:
          type: string
          pattern: '^(0|1)\.[0-9]{6,18}$'
        effective_from:
          type: string
          format: date
        effective_to:
          type:
            - string
            - "null"
          format: date
        version:
          type: integer
          minimum: 1
    BenefitEnrollment:
      type: object
      required:
        - id
        - plan_id
        - employment_id
        - base_amount_cents
        - employee_rate
        - employer_rate
        - employee_contribution_cents
        - employer_contribution_cents
        - effective_from
        - effective_to
        - version
      properties:
        id:
          type: integer
        plan_id:
          type: integer
        employment_id:
          type: integer
        base_amount_cents:
          type: integer
          minimum: 0
        employee_rate:
          type: string
        employer_rate:
          type: string
        employee_contribution_cents:
          type: integer
          minimum: 0
        employer_contribution_cents:
          type: integer
          minimum: 0
        effective_from:
          type: string
          format: date
        effective_to:
          type:
            - string
            - "null"
          format: date
        version:
          type: integer
          minimum: 1
    BenefitTransaction:
      type: object
      required:
        - id
        - enrollment_id
        - employment_id
        - period
        - base_amount_cents
        - employee_amount_cents
        - employer_amount_cents
        - total_amount_cents
        - payroll_run_id
        - status
      properties:
        id:
          type: integer
        enrollment_id:
          type: integer
        employment_id:
          type: integer
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        base_amount_cents:
          type: integer
          minimum: 0
        employee_amount_cents:
          type: integer
          minimum: 0
        employer_amount_cents:
          type: integer
          minimum: 0
        total_amount_cents:
          type: integer
          minimum: 0
        payroll_run_id:
          type:
            - integer
            - "null"
        status:
          type: string
          enum:
            - RECORDED
    BenefitProjection:
      allOf:
        - $ref: "#/components/schemas/ProjectionPagination"
        - type: object
          properties:
            items:
              type: array
              items: {}
    NoticeAudiencePreview:
      type: object
