        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/users/{id}/bindings:
    get:
      operationId: listUserBindings
      tags:
        - IAM Administration
      summary: List authority bindings for one access subject
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: X-Legal-Entity-Id
          in: header
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createUserBinding
      tags:
        - IAM Administration
      summary: Create an authority binding (requires fresh MFA step-up)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: X-Legal-Entity-Id
          in: header
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capability_code
                - anchor_type
                - field_profile
                - purpose_code
              properties:
                capability_code:
                  type: string
                  maxLength: 120
                anchor_type:
                  type: string
                  enum:
                    - SELF
                    - MANAGED
                    - ORG_UNIT
                    - ORG_SUBTREE
                    - CASE
                    - PAYROLL_RUN
                    - LEGAL_ENTITY
                anchor_id:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                field_profile:
                  type: string
                  enum:
                    - P0_PUBLIC
                    - P1_INTERNAL
                    - P2_SENSITIVE
                    - P3_RESTRICTED
                purpose_code:
                  type: string
                  maxLength: 48
                valid_from:
                  type: string
                  format: date-time
                valid_to:
                  type: string
                  format: date-time
      responses:
        "201":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SOD conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "419":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/bindings/{id}:
    delete:
      operationId: deleteBinding
      tags:
        - IAM Administration
      summary: Revoke an authority binding immediately
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: X-Legal-Entity-Id
          in: header
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "419":
          $ref: "#/components/responses/CsrfFailed"
  /v1/auth/events:
    get:
      operationId: listAuthEvents
      tags:
        - IAM Administration
      summary: Read append-only authentication and authorization events
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: X-Legal-Entity-Id
          in: header
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
