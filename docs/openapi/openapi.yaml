      operationId: engagementNoticesStore
      tags:
        - Engagement
      summary: Publish a notice to an org, role or all audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - body
                - audience
              properties:
                title:
                  type: string
                  maxLength: 200
                body:
                  type: string
                audience:
                  type: string
                  enum:
                    - ALL
                    - ORG
                    - ROLE
                audienceLabel:
                  type:
                    - string
                    - "null"
                orgUnitIds:
                  type: array
                  items:
                    type: integer
                roleCodes:
                  type: array
                  items:
                    type: string
                publishAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                requiresAck:
                  type: boolean
