        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: time.shift.schedule.read
    post:
      operationId: timeShiftSchedulesStore
      tags:
        - Time
      summary: Schedule one employment to one shift template for one business date
      description: |
        Exactly one schedule row may exist per employment per business date. A
        second template for the same day returns 409 `SCHEDULE_CONFLICT`; the
        database unique index enforces the same invariant under concurrency. A
        period that is already CLOSED rejects the write with 409 `PERIOD_CLOSED`
        until it is reopened with an audited reason. Requires capability
        `time.shift.schedule.manage`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
