openapi: 3.1.0
info:
  title: HRMS V1.0 API
  version: 1.0.0-reference
  description: |
    Reference implementation of the approved HRMS V1.0 architecture.
    Task 1 exposes only public liveness and metadata endpoints. Every other
    `/v1` route must be capability-guarded and documented here before merge.
  contact:
    name: HRMS Engineering
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://hrms.internal.invalid
    description: Placeholder production origin; replace at deployment
tags:
  - name: System
    description: Public liveness and API metadata.
  - name: IAM
    description: Identity, session and capability endpoints.
  - name: Organization
    description: Organization structure and positions.
  - name: People
    description: Person, employment and assignment facts.
  - name: Lifecycle
    description: Onboarding, transfer, offboarding and contracts.
  - name: Workflow
    description: Cases, decisions, effects and approvals.
  - name: Time
    description: Attendance, schedules and leave ledgers.
  - name: Payroll
    description: Payroll runs, payslips and corrections.
  - name: Talent
    description: Recruitment, performance and training.
  - name: Engagement
    description: Notices, notifications and self-service.
  - name: Reporting
    description: Projections, reports and exports.
security:
  - sessionCookie: []
    csrfHeader: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hrms_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  headers:
    XRequestId:
      description: Correlation id echoed from the request or generated as a ULID.
      schema:
        type: string
  parameters:
    AsOf:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Business date. Defaults to today in the legal entity timezone.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    MfaChallengeEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          const: ACCEPTED
        message:
          type: string
        data:
          type: object
          required:
            - status
            - challenge_id
            - masked_destination
            - expires_at
          properties:
            status:
              type: string
              const: MFA_REQUIRED
            challenge_id:
              type: string
            masked_destination:
              type: string
            expires_at:
              type:
                - string
                - "null"
              format: date-time
        request_id:
          type: string
    Envelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          examples:
            - OK
        message:
          type: string
        data: {}
        request_id:
          type: string
          examples:
            - 01M83YXN5D1504BQSXJ36VQPGF
    DashboardMetric:
      type: object
      required:
        - code
        - label
        - value
        - unit
        - status
        - reason
        - trend
        - trendDirection
        - drilldownLabel
        - sourceHash
        - computedAt
      properties:
        code:
          type: string
          enum:
            - headcount
            - probation
            - turnover
            - pending_approvals
            - contract_expiring
            - leave_liability
            - payroll_cost_by_entity
            - recruitment_funnel
        label:
          type: string
        value:
          type: integer
        unit:
          type: string
        status:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE
        reason:
          type:
            - string
            - "null"
        trend:
          type:
            - string
            - "null"
        trendDirection:
          type: string
          enum:
            - UP
            - DOWN
            - FLAT
        drilldownLabel:
          type: string
        sourceHash:
          type: string
        computedAt:
          type: string
          format: date-time
    DashboardPendingApproval:
      type: object
      description: Bounded preview of the pending_approvals projection under the same caller scope.
      required:
        - id
        - caseNo
        - title
        - status
        - ageDays
        - dueAt
      properties:
        id:
          type: integer
        caseNo:
          type: string
        title:
          type: string
        status:
          type: string
        ageDays:
          type: integer
          minimum: 0
        dueAt:
          type:
            - string
            - "null"
          format: date-time
    DashboardNotice:
      type: object
      description: Bounded published notice preview from the notice workspace seam.
      required:
        - id
        - title
        - publishedAt
        - requiresAck
        - acknowledged
        - authorName
      properties:
        id:
          type: integer
        title:
          type: string
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        requiresAck:
          type: boolean
        acknowledged:
          type: boolean
        authorName:
          type:
            - string
            - "null"
    DashboardContractAlert:
      type: object
      description: Bounded preview of contract_expiring rows in the panel's 30-day window.
      required:
        - employmentId
        - employeeName
        - employeeNo
        - orgName
        - endDate
        - daysRemaining
      properties:
        employmentId:
          type: integer
        employeeName:
          type: string
        employeeNo:
          type: string
        orgName:
          type: string
        endDate:
          type: string
          format: date
        daysRemaining:
          type: integer
          minimum: 0
          maximum: 30
    DashboardData:
      type: object
      required:
        - asOf
        - freshness
        - greeting
        - metrics
        - pendingApprovals
        - recentNotices
        - contractAlerts
      properties:
        asOf:
          type: string
          format: date
        freshness:
          type: string
          format: date-time
        greeting:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMetric"
        pendingApprovals:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/DashboardPendingApproval"
        recentNotices:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/DashboardNotice"
        contractAlerts:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/DashboardContractAlert"
    Pagination:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Paginated:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    EmploymentSnapshot:
      type: object
      required:
        - employment_id
        - person_id
        - legal_entity_id
        - employee_no
        - status
        - current_assignment
        - manager_employment_id
      properties:
        employment_id:
          type: integer
        person_id:
          type: integer
        person_name:
          type:
            - string
            - "null"
        employee_no:
          type: string
        legal_entity_id:
          type: integer
        status:
          type: string
          enum:
            - PROBATION
            - ACTIVE
            - LEAVE
            - SUSPENDED
            - TERMINATED
        employment_type:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - FIXED_TERM
            - INTERN
            - CONTRACTOR
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        current_assignment:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Assignment"
        manager_employment_id:
          type:
            - integer
            - "null"
    Assignment:
      type: object
      required:
        - id
        - employment_id
        - org_unit_id
        - assignment_type
        - is_primary
        - valid_from
        - valid_to
      properties:
        id:
          type: integer
        employment_id:
          type: integer
        org_unit_id:
          type: integer
        position_id:
          type:
            - integer
            - "null"
        manager_assignment_id:
          type:
            - integer
            - "null"
        assignment_type:
          type: string
          enum:
            - PRIMARY
            - SECONDMENT
            - MATRIX
            - PROJECT
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    Terms:
      type: object
      properties:
        id:
          type: integer
        employment_id:
          type: integer
        version:
          type: integer
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        work_location:
          type: string
        work_schedule:
          type: string
        salary_scheme_code:
          type:
            - string
            - "null"
        notice_period_days:
          type: integer
        confidentiality:
          type: boolean
        non_compete:
          type: boolean
        probation_end_date:
          type:
            - string
            - "null"
          format: date
    Person:
      type: object
      required:
        - id
        - legal_name
      properties:
        id:
          type: integer
        legal_name:
          type: string
        preferred_name:
          type:
            - string
            - "null"
        birth_date:
          type:
            - string
            - "null"
          format: date
        gender:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        mobile:
          type:
            - string
            - "null"
          description: Masked for P1 callers. Identity numbers are never serialized.
    OrgUnit:
      type: object
      required:
        - id
        - legal_entity_id
        - code
        - name
        - type
      properties:
        id:
          type: integer
        legal_entity_id:
          type: integer
        parent_id:
          type:
            - integer
            - "null"
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - COMPANY
            - DIVISION
            - DEPARTMENT
            - TEAM
            - COST_CENTER
            - SHARED_SERVICE
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    PersonCreate:
      type: object
      required:
        - legal_name
      properties:
        legal_name:
          type: string
          maxLength: 120
        preferred_name:
          type:
            - string
            - "null"
          maxLength: 120
        id_type:
          type:
            - string
            - "null"
          maxLength: 32
        id_number:
          type:
            - string
            - "null"
          maxLength: 128
          writeOnly: true
        birth_date:
          type:
            - string
            - "null"
          format: date
        gender:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
          minLength: 2
          maxLength: 2
        mobile:
          type:
            - string
            - "null"
          writeOnly: true
        email:
          type:
            - string
            - "null"
          format: email
    EmploymentCreate:
      type: object
      required:
        - person_id
        - legal_entity_id
        - employee_no
        - employment_type
        - valid_from
        - hire_date
      properties:
        person_id:
          type: integer
        legal_entity_id:
          type: integer
        employee_no:
          type: string
          maxLength: 64
        employment_type:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - FIXED_TERM
            - INTERN
            - CONTRACTOR
        status:
          type: string
          enum:
            - PROBATION
            - ACTIVE
            - LEAVE
            - SUSPENDED
            - TERMINATED
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        hire_date:
          type: string
          format: date
        termination_date:
          type:
            - string
            - "null"
          format: date
        seniority_start_date:
          type:
            - string
            - "null"
          format: date
    AssignmentCreate:
      type: object
      required:
        - org_unit_id
        - assignment_type
        - valid_from
      properties:
        org_unit_id:
          type: integer
        position_id:
          type:
            - integer
            - "null"
        manager_assignment_id:
          type:
            - integer
            - "null"
        assignment_type:
          type: string
          enum:
            - PRIMARY
            - SECONDMENT
            - MATRIX
            - PROJECT
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    TermsCreate:
      type: object
      required:
        - effective_from
        - work_location
        - work_schedule
      properties:
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        probation_end_date:
          type:
            - string
            - "null"
          format: date
        work_location:
          type: string
        work_schedule:
          type: string
        salary_scheme_code:
          type:
            - string
            - "null"
        notice_period_days:
          type: integer
          minimum: 0
        confidentiality:
          type: boolean
        non_compete:
          type: boolean
        signed_at:
          type:
            - string
            - "null"
          format: date-time
    DocumentCreate:
      type: object
      required:
        - file_object_id
        - category
        - retention_class
      properties:
        file_object_id:
          type: integer
        category:
          type: string
          enum:
            - CONTRACT
            - ID
            - EDUCATION
            - CERTIFICATE
            - OTHER
        signed_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date
        retention_class:
          type: string
          maxLength: 32
        legal_hold:
          type: boolean
    OrgUnitCreate:
      type: object
      required:
        - legal_entity_id
        - code
        - name
        - type
      properties:
        legal_entity_id:
          type: integer
        parent_id:
          type:
            - integer
            - "null"
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 160
        type:
          type: string
          enum:
            - COMPANY
            - DIVISION
            - DEPARTMENT
            - TEAM
            - COST_CENTER
            - SHARED_SERVICE
        valid_from:
          type:
            - string
            - "null"
          format: date
        valid_to:
          type:
            - string
            - "null"
          format: date
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          examples:
            - FORBIDDEN
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        request_id:
          type: string
    HealthData:
      type: object
      required:
        - status
        - version
        - checks
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        version:
          type: string
        checks:
          type: object
          required:
            - db
            - cache
            - storage
          properties:
            db:
              type: boolean
            cache:
              type: boolean
            storage:
              type: boolean
        time:
          type: string
          format: date-time
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"
    HealthUnavailableEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"
    MetaData:
      type: object
      required:
        - version
        - environment
        - server_time
        - supported_timezones
        - api_version
      properties:
        version:
          type: string
        environment:
          type: string
        server_time:
          type: string
          format: date-time
        api_version:
          type: string
        supported_timezones:
          type: array
          items:
            type: string
    MetaEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MetaData"
    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - user
                - csrf_token
                - session
              properties:
                user:
                  type: object
                  required:
                    - id
                    - username
                    - is_privileged
                    - mfa_enrolled
                    - auth_version
                  properties:
                    id:
                      type: integer
                    username:
                      type: string
                    email:
                      type:
                        - string
                        - "null"
                    is_privileged:
                      type: boolean
                    mfa_enrolled:
                      type: boolean
                    auth_version:
                      type: integer
                csrf_token:
                  type: string
                  description: Raw CSRF token; only its SHA-256 hash is stored
                session:
                  type: object
                  required:
                    - id
                    - mfa_verified
                    - idle_expires_at
                    - absolute_expires_at
                  properties:
                    id:
                      type: string
                    mfa_verified:
                      type: boolean
                    idle_expires_at:
                      type: string
                      format: date-time
                    absolute_expires_at:
                      type: string
                      format: date-time
    LeaveBalance:
      type: object
      properties:
        leaveTypeCode:
          type: string
        leaveTypeName:
          type: string
        unit:
          type: string
          enum:
            - DAY
            - HOUR
        granted:
          type: number
        used:
          type: number
        pending:
          type: number
        available:
          type: number
        expiresOn:
          type:
            - string
            - "null"
          format: date
        leaveTypeId:
          type: integer
        asOf:
          type: string
          format: date
        grantedMinutes:
          type: integer
        reservedMinutes:
          type: integer
        consumedMinutes:
          type: integer
        releasedMinutes:
          type: integer
        expiredMinutes:
          type: integer
        adjustedMinutes:
          type: integer
        reversedMinutes:
          type: integer
        availableMinutes:
          type: integer
        balanceMinutes:
          type: integer
        balanceDays:
          type: string
        standardDayMinutes:
          type: integer
        unexplainedDifference:
          type: integer
    LeaveLedgerEntry:
      type: object
      properties:
        id:
          type: string
        occurredAt:
          type:
            - string
            - "null"
        businessDate:
          type: string
          format: date
        effectiveOn:
          type: string
          format: date
        entryType:
          type: string
          enum:
            - GRANT
            - RESERVE
            - CONSUME
            - RELEASE
            - EXPIRE
            - ADJUST
            - REVERSE
        account:
          type: string
        quantity:
          type: integer
        quantityMinutes:
          type: integer
        balanceAfter:
          type: integer
        reason:
          type: string
        sourceType:
          type: string
        sourceId:
          type: string
        sourceCaseNo:
          type:
            - string
            - "null"
        caseId:
          type:
            - integer
            - "null"
    AttendanceMonth:
      type: object
      properties:
        month:
          type: string
          examples:
            - 2026-11
        timezone:
          type: string
          examples:
            - Asia/Shanghai
        employeeName:
          type: string
          examples:
            - E0001
        days:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              weekday:
                type: string
              status:
                type: string
                examples:
                  - PRESENT
                  - LATE
                  - ABSENT
                  - LEAVE
                  - REST
                  - HOLIDAY
                  - EARLY
                  - INCOMPLETE
              scheduledStart:
                type:
                  - string
                  - "null"
              scheduledEnd:
                type:
                  - string
                  - "null"
              firstIn:
                type:
                  - string
                  - "null"
              lastOut:
                type:
                  - string
                  - "null"
              workedMinutes:
                type: integer
              exceptionLabel:
                type:
                  - string
                  - "null"
              scheduled_minutes:
                type: integer
        summary:
          type: object
          properties:
            expectedDays:
              type: integer
            presentDays:
              type: integer
            lateCount:
              type: integer
            absentCount:
              type: integer
            leaveDays:
              type: integer
            remoteDays:
              type: integer
        exceptions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              status:
                type: string
              exceptionLabel:
                type:
                  - string
                  - "null"
  responses:
    Unauthenticated:
      description: Missing, expired, revoked or stale-auth-version session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Authentication is required.
                data:
                  reason: UNAUTHENTICATED
                request_id: 01M83YXN5D1504BQSXJ36VQPGF
    Forbidden:
      description: Capability, anchor, MFA or field policy denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Missing or out-of-scope resource (never discloses other tenants)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Validation or non-filterable-field error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Login or request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Envelope:
      description: Standard success envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    CsrfFailed:
      description: Missing or invalid X-CSRF-Token on a mutating request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            csrf:
              value:
                code: CSRF_FAILED
                message: The CSRF token is missing or invalid.
                data:
                  reason: CSRF_FAILED
                request_id: 01M83YXN5D1504BQSXJ36VQPGF
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and dependency health
      description: |
        Public endpoint. Returns 200 when the database is reachable; cache or
        storage failure downgrades status to `degraded` but remains 200. A
        database failure returns 503 with the same data shape in the error
        envelope.
      tags:
        - System
      security: []
      responses:
        "200":
          description: Service is healthy or degraded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Database check failed; service unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailableEnvelope"
        default:
          $ref: "#/components/responses/InternalError"
