        "200":
          description: Shift schedules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Pagination"
                          - type: object
                            required:
                              - items
                              - total
                              - as_of
                              - freshness
                              - source_hash
                            properties:
                              as_of:
                                type: string
                                format: date
                              freshness:
                                type: string
                                enum:
                                  - LIVE
                                  - MATERIALIZED
                                  - STALE
                              source_hash:
                                type: string
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ShiftSchedule"
