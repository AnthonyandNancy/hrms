openapi: 3.1.0
info:
  title: HRMS V1.0 API
  version: 1.0.0-reference
  description: |
    Reference implementation of the approved HRMS V1.0 architecture.
    Task 1 exposes only public liveness and metadata endpoints. Every other
    `/v1` route must be capability-guarded and documented here before merge.
  contact:
    name: HRMS Engineering
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://hrms.internal.invalid
    description: Placeholder production origin; replace at deployment
tags:
  - name: System
    description: Public liveness and API metadata.
  - name: IAM
    description: Identity, session and capability endpoints.
  - name: Organization
    description: Organization structure and positions.
  - name: People
    description: Person, employment and assignment facts.
  - name: Lifecycle
    description: Onboarding, transfer, offboarding and contracts.
  - name: Workflow
    description: Cases, decisions, effects and approvals.
  - name: Time
    description: Attendance, schedules and leave ledgers.
  - name: Payroll
    description: Payroll runs, payslips and corrections.
  - name: Talent
    description: Recruitment, performance and training.
  - name: Engagement
    description: Notices, notifications and self-service.
  - name: Reporting
    description: Projections, reports and exports.
security:
  - sessionCookie: []
    csrfHeader: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hrms_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  headers:
    XRequestId:
      description: Correlation id echoed from the request or generated as a ULID.
      schema:
        type: string
  parameters:
    AsOf:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Business date. Defaults to today in the legal entity timezone.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    Envelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          examples:
            - OK
        message:
          type: string
        data: {}
        request_id:
          type: string
          examples:
            - 01M83YXN5D1504BQSXJ36VQPGF
    Pagination:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Paginated:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    EmploymentSnapshot:
      type: object
      required:
        - employment_id
        - person_id
        - legal_entity_id
        - employee_no
        - status
        - current_assignment
        - manager_employment_id
      properties:
        employment_id:
          type: integer
        person_id:
          type: integer
        person_name:
          type:
            - string
            - "null"
        employee_no:
          type: string
        legal_entity_id:
          type: integer
        status:
          type: string
          enum:
            - PROBATION
            - ACTIVE
            - LEAVE
            - SUSPENDED
            - TERMINATED
        employment_type:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - FIXED_TERM
            - INTERN
            - CONTRACTOR
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        current_assignment:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Assignment"
        manager_employment_id:
          type:
            - integer
            - "null"
    Assignment:
      type: object
      required:
        - id
        - employment_id
        - org_unit_id
        - assignment_type
        - is_primary
        - valid_from
        - valid_to
      properties:
        id:
          type: integer
        employment_id:
          type: integer
        org_unit_id:
          type: integer
        position_id:
          type:
            - integer
            - "null"
        manager_assignment_id:
          type:
            - integer
            - "null"
        assignment_type:
          type: string
          enum:
            - PRIMARY
            - SECONDMENT
            - MATRIX
            - PROJECT
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    Terms:
      type: object
      properties:
        id:
          type: integer
        employment_id:
          type: integer
        version:
          type: integer
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        work_location:
          type: string
        work_schedule:
          type: string
        salary_scheme_code:
          type:
            - string
            - "null"
        notice_period_days:
          type: integer
        confidentiality:
          type: boolean
        non_compete:
          type: boolean
        probation_end_date:
          type:
            - string
            - "null"
          format: date
    Person:
      type: object
      required:
        - id
        - legal_name
      properties:
        id:
          type: integer
        legal_name:
          type: string
        preferred_name:
          type:
            - string
            - "null"
        birth_date:
          type:
            - string
            - "null"
          format: date
        gender:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        mobile:
          type:
            - string
            - "null"
          description: Masked for P1 callers. Identity numbers are never serialized.
    OrgUnit:
      type: object
      required:
        - id
        - legal_entity_id
        - code
        - name
        - type
      properties:
        id:
          type: integer
        legal_entity_id:
          type: integer
        parent_id:
          type:
            - integer
            - "null"
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - COMPANY
            - DIVISION
            - DEPARTMENT
            - TEAM
            - COST_CENTER
            - SHARED_SERVICE
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    PersonCreate:
      type: object
      required:
        - legal_name
      properties:
        legal_name:
          type: string
          maxLength: 120
        preferred_name:
          type:
            - string
            - "null"
          maxLength: 120
        id_type:
          type:
            - string
            - "null"
          maxLength: 32
        id_number:
          type:
            - string
            - "null"
          maxLength: 128
          writeOnly: true
        birth_date:
          type:
            - string
            - "null"
          format: date
        gender:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
          minLength: 2
          maxLength: 2
        mobile:
          type:
            - string
            - "null"
          writeOnly: true
        email:
          type:
            - string
            - "null"
          format: email
    EmploymentCreate:
      type: object
      required:
        - person_id
        - legal_entity_id
        - employee_no
        - employment_type
        - valid_from
        - hire_date
      properties:
        person_id:
          type: integer
        legal_entity_id:
          type: integer
        employee_no:
          type: string
          maxLength: 64
        employment_type:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - FIXED_TERM
            - INTERN
            - CONTRACTOR
        status:
          type: string
          enum:
            - PROBATION
            - ACTIVE
            - LEAVE
            - SUSPENDED
            - TERMINATED
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        hire_date:
          type: string
          format: date
        termination_date:
          type:
            - string
            - "null"
          format: date
        seniority_start_date:
          type:
            - string
            - "null"
          format: date
    AssignmentCreate:
      type: object
      required:
        - org_unit_id
        - assignment_type
        - valid_from
      properties:
        org_unit_id:
          type: integer
        position_id:
          type:
            - integer
            - "null"
        manager_assignment_id:
          type:
            - integer
            - "null"
        assignment_type:
          type: string
          enum:
            - PRIMARY
            - SECONDMENT
            - MATRIX
            - PROJECT
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    TermsCreate:
      type: object
      required:
        - effective_from
        - work_location
        - work_schedule
      properties:
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        probation_end_date:
          type:
            - string
            - "null"
          format: date
        work_location:
          type: string
        work_schedule:
          type: string
        salary_scheme_code:
          type:
            - string
            - "null"
        notice_period_days:
          type: integer
          minimum: 0
        confidentiality:
          type: boolean
        non_compete:
          type: boolean
        signed_at:
          type:
            - string
            - "null"
          format: date-time
    DocumentCreate:
      type: object
      required:
        - file_object_id
        - category
        - retention_class
      properties:
        file_object_id:
          type: integer
        category:
          type: string
          enum:
            - CONTRACT
            - ID
            - EDUCATION
            - CERTIFICATE
            - OTHER
        signed_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date
        retention_class:
          type: string
          maxLength: 32
        legal_hold:
          type: boolean
    OrgUnitCreate:
      type: object
      required:
        - legal_entity_id
        - code
        - name
        - type
      properties:
        legal_entity_id:
          type: integer
        parent_id:
          type:
            - integer
            - "null"
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 160
        type:
          type: string
          enum:
            - COMPANY
            - DIVISION
            - DEPARTMENT
            - TEAM
            - COST_CENTER
            - SHARED_SERVICE
        valid_from:
          type:
            - string
            - "null"
          format: date
        valid_to:
          type:
            - string
            - "null"
          format: date
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          examples:
            - FORBIDDEN
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        request_id:
          type: string
    HealthData:
      type: object
      required:
        - status
        - version
        - checks
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        version:
          type: string
        checks:
          type: object
          required:
            - db
            - cache
            - storage
          properties:
            db:
              type: boolean
            cache:
              type: boolean
            storage:
              type: boolean
        time:
          type: string
          format: date-time
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"
    HealthUnavailableEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"
    MetaData:
      type: object
      required:
        - version
        - environment
        - server_time
        - supported_timezones
        - api_version
      properties:
        version:
          type: string
        environment:
          type: string
        server_time:
          type: string
          format: date-time
        api_version:
          type: string
        supported_timezones:
          type: array
          items:
            type: string
    MetaEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MetaData"
    SessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - user
                - csrf_token
                - session
              properties:
                user:
                  type: object
                  required:
                    - id
                    - username
                    - is_privileged
                    - mfa_enrolled
                    - auth_version
                  properties:
                    id:
                      type: integer
                    username:
                      type: string
                    email:
                      type:
                        - string
                        - "null"
                    is_privileged:
                      type: boolean
                    mfa_enrolled:
                      type: boolean
                    auth_version:
                      type: integer
                csrf_token:
                  type: string
                  description: Raw CSRF token; only its SHA-256 hash is stored
                session:
                  type: object
                  required:
                    - id
                    - mfa_verified
                    - idle_expires_at
                    - absolute_expires_at
                  properties:
                    id:
                      type: string
                    mfa_verified:
                      type: boolean
                    idle_expires_at:
                      type: string
                      format: date-time
                    absolute_expires_at:
                      type: string
                      format: date-time
  responses:
    Unauthenticated:
      description: Missing, expired, revoked or stale-auth-version session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Authentication is required.
                data:
                  reason: UNAUTHENTICATED
                request_id: 01M83YXN5D1504BQSXJ36VQPGF
    Forbidden:
      description: Capability, anchor, MFA or field policy denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Missing or out-of-scope resource (never discloses other tenants)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Validation or non-filterable-field error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Login or request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Envelope:
      description: Standard success envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    CsrfFailed:
      description: Missing or invalid X-CSRF-Token on a mutating request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            csrf:
              value:
                code: CSRF_FAILED
                message: The CSRF token is missing or invalid.
                data:
                  reason: CSRF_FAILED
                request_id: 01M83YXN5D1504BQSXJ36VQPGF
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and dependency health
      description: |
        Public endpoint. Returns 200 when the database is reachable; cache or
        storage failure downgrades status to `degraded` but remains 200. A
        database failure returns 503 with the same data shape in the error
        envelope.
      tags:
        - System
      security: []
      responses:
        "200":
          description: Service is healthy or degraded.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Database check failed; service unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailableEnvelope"
        default:
          $ref: "#/components/responses/InternalError"
  /v1/meta:
    get:
      operationId: getMeta
      summary: Public API metadata
      description: Public endpoint returning build, environment and timezone metadata.
      tags:
        - System
      security: []
      responses:
        "200":
          description: API metadata.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/employees:
    get:
      tags:
        - People
      operationId: listEmployees
      summary: Paginated as-of employee projection
      description: Requires capability `people.employee.read`. Rows are constrained before pagination.
      parameters:
        - $ref: "#/components/parameters/AsOf"
        - name: org_unit_id
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Employee page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Paginated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/employees/{employment_id}:
    get:
      tags:
        - People
      operationId: getEmployee
      summary: Employment profile, current assignment, manager, terms and contracts
      description: Requires capability `people.employee.read`. Out-of-scope rows return 404.
      parameters:
        - name: employment_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: Employment detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EmploymentSnapshot"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/persons:
    post:
      tags:
        - People
      operationId: createPerson
      summary: Create a natural person (identity hashed + encrypted)
      description: Requires capability `people.employee.manage`. Identity plaintext is never returned or audited.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreate"
      responses:
        "201":
          description: Person created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/employments:
    post:
      tags:
        - People
      operationId: createEmployment
      summary: Create an employment (employee number unique per tenant+legal entity)
      description: Requires capability `people.employee.manage`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmploymentCreate"
      responses:
        "201":
          description: Employment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/employments/{employment_id}/assignments:
    post:
      tags:
        - People
      operationId: createAssignment
      summary: Append an assignment; PRIMARY overlap and legal-entity boundary enforced
      description: Requires capability `people.assignment.manage`.
      parameters:
        - name: employment_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentCreate"
      responses:
        "201":
          description: Assignment appended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Assignment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /v1/employments/{employment_id}/terms:
    post:
      tags:
        - People
      operationId: appendTerms
      summary: Append a new terms version; previous open version is ended
      description: Requires capability `people.contract.manage`.
      parameters:
        - name: employment_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsCreate"
      responses:
        "201":
          description: Terms version appended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Terms"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
