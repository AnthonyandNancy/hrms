      description: Requires capability `time.punch.import`. Punches are immutable; duplicate payload hashes are no-ops.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employment_id:
                  type: integer
                punches:
                  type: array
                  items:
                    type: object
                    properties:
                      punched_at_utc:
                        type: string
                        format: date-time
                      source:
                        type: string
                        enum:
                          - DEVICE
                          - MANUAL
                          - IMPORT
                      device_id:
                        type:
                          - string
                          - "null"
                      source_local_offset:
                        type:
                          - string
                          - "null"
                      raw_payload_hash:
                        type:
                          - string
                          - "null"
              required:
                - employment_id
                - punches
      responses:
        "200":
          description: Import result; repeated hashes are counted as replayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          employment_id:
                            type: integer
                          total:
                            type: integer
                          created:
                            type: integer
                          replayed:
                            type: integer
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                punched_at_utc:
                                  type: string
                                device_id:
                                  type:
                                    - string
                                    - "null"
                                source:
                                  type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
