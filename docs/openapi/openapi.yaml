    BenefitPlanEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BenefitPlan"
    BenefitEnrollmentEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BenefitEnrollment"
    BenefitTransactionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BenefitTransaction"
    BenefitProjectionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BenefitProjection"
    NoticeAudiencePreviewEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NoticeAudiencePreview"
    NoticeTemplateEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NoticeTemplate"
    NoticeReadExportEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NoticeReadExport"
    NoticeDecisionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NoticeDecision"
  responses:
    Unauthenticated:
      description: Missing, expired, revoked or stale-auth-version session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthenticated:
              value:
                code: UNAUTHENTICATED
                message: Authentication is required.
                data:
                  reason: UNAUTHENTICATED
                request_id: 01M83YXN5D1504BQSXJ36VQPGF
    Forbidden:
      description: Capability, anchor, MFA or field policy denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Missing or out-of-scope resource (never discloses other tenants)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: Validation or non-filterable-field error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Login or request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Envelope:
      description: Standard success envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    CsrfFailed:
      description: Missing or invalid X-CSRF-Token on a mutating request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            csrf:
              value:
                code: CSRF_FAILED
                message: The CSRF token is missing or invalid.
                data:
                  reason: CSRF_FAILED
                request_id: 01M83YXN5D1504BQSXJ36VQPGF
paths:
  /v1/access-review:
    get:
      operationId: getAccessReview
      tags:
        - IAM Audit
      summary: Quarterly read-only access review
      responses:
        "200":
          description: Quarterly access review
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AccessReviewData"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: iam.audit.read
  /v1/auth/break-glass:
    post:
      operationId: activateBreakGlass
      tags:
        - IAM Break Glass
      summary: Two-person, 30-minute emergency elevation
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approver_user_id
                - reason
              properties:
                approver_user_id:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                scope:
                  type: array
                  maxItems: 10
                  items:
                    type: string
      responses:
        "201":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "419":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "409":
          $ref: "#/components/responses/Conflict"
      x-capability: iam.session.manage
      x-action-label: 申请紧急授权
  /v1/auth/break-glass/{id}/revoke:
    post:
      operationId: revokeBreakGlass
      tags:
        - IAM Break Glass
      summary: Revoke a break-glass grant as either party
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Break-glass grant revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BreakGlassRevocationData"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-capability: iam.session.manage
      x-action-label: 撤销紧急授权
  /v1/system/company-profile:
    get:
      operationId: getCompanyProfile
      tags:
        - Platform Governance
      summary: Read the single company profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CompanyProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: system.settings.manage
    patch:
      operationId: updateCompanyProfile
      tags:
        - Platform Governance
      summary: Update the single company profile
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileUpdateRequest"
      responses:
        "200":
          description: Company profile updated and audited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CompanyProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: system.settings.manage
      x-action-label: 保存公司资料
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      tags:
        - IAM Administration
      summary: Server-side filtered security audit events
      parameters:
        - name: actor
          in: query
          schema: { type: string, maxLength: 32 }
        - name: action
          in: query
          schema: { type: string, maxLength: 64 }
        - name: result
          in: query
          schema: { type: string, maxLength: 16 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Filtered security events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthEventPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: iam.audit.read
  /v1/audit/events/export:
    post:
      operationId: exportAuditEvents
      tags:
        - IAM Administration
      summary: Export allow-listed security audit fields
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
