                - shift_template_id
              properties:
                employment_id:
                  type: integer
                  minimum: 1
                business_date:
                  type: string
                  format: date
                shift_template_id:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Schedule created or replayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ShiftScheduleWrite"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
