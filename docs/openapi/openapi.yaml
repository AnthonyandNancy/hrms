  /v1/users/{id}/roles/{roleCode}:
    delete:
      operationId: revokeRole
      tags:
        - IAM Administration
      summary: Revoke a role from a user and replay the authorization snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: roleCode
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{2,63}$
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
      responses:
        "200":
          description: Role revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [user_id, role_code, revoked]
                        properties:
                          user_id: { type: integer }
                          role_code: { type: string }
                          revoked: { type: boolean, const: true }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
