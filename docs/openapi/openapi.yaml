openapi: 3.1.0
info:
  title: HRMS V1.0 API
  version: 1.0.0-reference
  description: |
    Reference implementation of the approved HRMS V1.0 architecture.
    Task 1 exposes only public liveness and metadata endpoints. Every other
    `/v1` route must be capability-guarded and documented here before merge.
  contact:
    name: HRMS Engineering
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://hrms.internal.invalid
    description: Placeholder production origin; replace at deployment
tags:
  - name: System
    description: Public liveness and API metadata.
  - name: IAM
    description: Identity, session and capability endpoints.
  - name: Organization
    description: Organization structure and positions.
  - name: People
    description: Person, employment and assignment facts.
  - name: Lifecycle
    description: Onboarding, transfer, offboarding and contracts.
  - name: Workflow
    description: Cases, decisions, effects and approvals.
  - name: Time
    description: Attendance, schedules and leave ledgers.
  - name: Payroll
    description: Payroll runs, payslips and corrections.
  - name: Talent
    description: Recruitment, performance and training.
  - name: Engagement
    description: Notices, notifications and self-service.
  - name: Reporting
    description: Projections, reports and exports.
security:
  - sessionCookie: []
    csrfHeader: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hrms_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  headers:
    XRequestId:
      description: Correlation id echoed from the request or generated as a ULID.
      schema:
        type: string
  parameters:
    AsOf:
      name: as_of
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Business date. Defaults to today in the legal entity timezone.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    LeaveTypeCatalog:
      type: object
      required: [id, code, name, unit, is_statutory, is_annual, annual_entitlement_days, requires_attachment, allow_negative, version]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        unit: { type: string }
        is_statutory: { type: boolean }
        is_annual: { type: boolean }
        annual_entitlement_days: { type: [string, "null"] }
        requires_attachment: { type: boolean }
        allow_negative: { type: boolean }
        version: { type: integer }
    LeavePolicyCatalog:
      type: object
      required: [leave_type_code, unit, expiry_rule, legal_basis, version]
      properties:
        leave_type_code: { type: string }
        unit: { type: string }
        expiry_rule: { type: [object, "null"], additionalProperties: true }
        legal_basis: { type: [string, "null"] }
        version: { type: integer }
    OvertimeRecordCatalog:
      type: object
      required: [id, employment_id, business_date, minutes, status, case_id, settlement_method, settlement_id]
      properties:
        id: { type: integer }
        employment_id: { type: integer }
        business_date: { type: string, format: date }
        minutes: { type: integer }
        status: { type: string }
        case_id: { type: [integer, "null"] }
        settlement_method: { type: [string, "null"] }
        settlement_id: { type: [integer, "null"] }
    OvertimeRequest:
      type: object
      required: [id, employment_id, business_date, declared_minutes, confirmed_minutes, status, reason, case_id, overtime_record_id, recorded_at]
      properties:
        id: { type: integer, minimum: 1 }
        employment_id: { type: integer, minimum: 1 }
        business_date: { type: string, format: date }
        declared_minutes: { type: integer, minimum: 1, maximum: 10080 }
        confirmed_minutes: { type: [integer, "null"], minimum: 1, maximum: 10080 }
        status: { type: string, enum: [SUBMITTED, APPROVED, CONFIRMED, REJECTED, CANCELLED] }
        reason: { type: string, minLength: 3, maxLength: 500 }
        case_id: { type: [integer, "null"] }
        overtime_record_id: { type: [integer, "null"] }
        recorded_at: { type: [string, "null"], format: date-time }
    OvertimeRequestProjection:
      type: object
      required: [items, page, page_size, total, as_of, freshness, source_hash, partial, partial_reason, drilldown]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OvertimeRequest"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        as_of: { type: string, format: date }
        freshness: { type: string, enum: [LIVE, MATERIALIZED, STALE] }
        source_hash: { type: string }
        partial: { type: boolean }
        partial_reason: { type: [string, "null"] }
        drilldown: { type: [object, "null"], additionalProperties: true }
    TimeoffBalanceItem:
      type: object
      required: [settlement_id, overtime_record_id, employment_id, business_date, method, minutes, reason, recorded_at]
      properties:
        settlement_id: { type: integer, minimum: 1 }
        overtime_record_id: { type: integer, minimum: 1 }
        employment_id: { type: integer, minimum: 1 }
        business_date: { type: [string, "null"], format: date }
        method: { type: string, const: TIMEOFF }
        minutes: { type: integer, minimum: 1 }
        reason: { type: string }
        recorded_at: { type: [string, "null"], format: date-time }
    TimeoffBalanceProjection:
      type: object
      required: [items, page, page_size, total, as_of, freshness, source_hash, partial, partial_reason, drilldown, employment_id, available_minutes, settlement_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimeoffBalanceItem"
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        as_of: { type: string, format: date }
        freshness: { type: string, enum: [LIVE, MATERIALIZED, STALE] }
        source_hash: { type: string }
        partial: { type: boolean }
        partial_reason: { type: [string, "null"] }
        drilldown: { type: [object, "null"], additionalProperties: true }
        employment_id: { type: integer, minimum: 1 }
        available_minutes: { type: integer, minimum: 0 }
        settlement_count: { type: integer, minimum: 0 }
    OvertimePolicy:
      type: object
      required: [multiplier, allow_pay, allow_timeoff, statutory_holiday_multiplier, source, note]
      properties:
        multiplier: { type: string }
        allow_pay: { type: boolean }
        allow_timeoff: { type: boolean }
        statutory_holiday_multiplier: { type: string }
        source: { type: string }
        note: { type: string }
    MyPermissionsData:
      type: object
      required: [menus, actions, field_capabilities, scope_labels, auth_version, pages, wildcard]
      properties:
        menus:
          type: array
          items:
            type: object
            additionalProperties: true
        actions:
          type: array
          items: { type: string }
        field_capabilities:
          type: array
          items: { type: string }
        scope_labels:
          type: array
          items:
            type: object
            required: [anchor_type, label]
            properties:
              anchor_type: { type: string }
              label: { type: string }
        auth_version: { type: integer }
        pages:
          type: array
          items:
            type: object
            additionalProperties: true
        wildcard: { type: boolean }
    MyCapabilitiesEnvelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: string, const: OK }
        message: { type: string }
        data:
          type: object
          required: [capabilities, wildcard, mfa_required, mfa_verified]
          properties:
            capabilities:
              type: array
              items:
                type: object
                required: [capability, anchor_type, field_profile]
                properties:
                  capability: { type: string }
                  anchor_type: { type: string }
                  anchor_id: { type: [integer, 'null'] }
                  field_profile: { type: string }
                  purpose_code: { type: string }
                  valid_from: { type: [string, 'null'], format: date-time }
                  valid_to: { type: [string, 'null'], format: date-time }
                  wildcard:
                    type: boolean
                    description: Present and true only on rows synthesized from a wildcard grant.
            wildcard:
              type: boolean
              description: True when the caller holds `*`; capabilities are then the expanded catalog.
            mfa_required: { type: boolean }
            mfa_verified: { type: boolean }
        request_id: { type: string }
    AccessReviewEnvelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: string, const: OK }
        message: { type: string }
        data:
          type: object
          required: [generated_at, unused_high_risk_bindings, sod_risks]
          properties:
            generated_at: { type: string, format: date-time }
            unused_high_risk_bindings:
              type: array
              items:
                type: object
                properties:
                  binding_id: { type: integer }
                  principal_id: { type: integer }
                  capability_code: { type: string }
                  risk: { type: [string, 'null'] }
                  created_at: { type: [string, 'null'], format: date-time }
            sod_risks:
              type: array
              items:
                type: object
                required: [principal_id, capabilities, kind]
                properties:
                  principal_id: { type: integer }
                  capabilities:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items: { type: string }
                  kind: { type: string, enum: [CUMULATIVE, OBJECT_LEVEL] }
        request_id: { type: string }
    MfaChallengeEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          const: ACCEPTED
        message:
          type: string
        data:
          type: object
          required:
            - status
            - challenge_id
            - masked_destination
            - expires_at
          properties:
            status:
              type: string
              const: MFA_REQUIRED
            challenge_id:
              type: string
            masked_destination:
              type: string
            expires_at:
              type:
                - string
                - "null"
              format: date-time
        request_id:
          type: string
    Envelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          examples:
            - OK
        message:
          type: string
        data: {}
        request_id:
          type: string
          examples:
            - 01M83YXN5D1504BQSXJ36VQPGF
    DashboardMetric:
      type: object
      required:
        - code
        - label
        - value
        - unit
        - status
        - reason
        - trend
        - trendDirection
        - drilldownLabel
        - sourceHash
        - computedAt
      properties:
        code:
          type: string
          enum:
            - headcount
            - probation
            - turnover
            - pending_approvals
            - contract_expiring
            - leave_liability
            - payroll_cost_by_entity
            - recruitment_funnel
        label:
          type: string
        value:
          type: integer
        unit:
          type: string
        status:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE
        reason:
          type:
            - string
            - "null"
        trend:
          type:
            - string
            - "null"
        trendDirection:
          type: string
          enum:
            - UP
            - DOWN
            - FLAT
        drilldownLabel:
          type: string
        sourceHash:
          type: string
        computedAt:
          type: string
          format: date-time
    DashboardPendingApproval:
      type: object
      description: Bounded preview of the pending_approvals projection under the same caller scope.
      required:
        - id
        - caseNo
        - title
        - status
        - ageDays
        - dueAt
      properties:
        id:
          type: integer
        caseNo:
          type: string
        title:
          type: string
        status:
          type: string
        ageDays:
          type: integer
          minimum: 0
        dueAt:
          type:
            - string
            - "null"
          format: date-time
    DashboardNotice:
      type: object
      description: Bounded published notice preview from the notice workspace seam.
      required:
        - id
        - title
        - publishedAt
        - requiresAck
        - acknowledged
        - authorName
      properties:
        id:
          type: integer
        title:
          type: string
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        requiresAck:
          type: boolean
        acknowledged:
          type: boolean
        authorName:
          type:
            - string
            - "null"
    DashboardContractAlert:
      type: object
      description: Bounded preview of contract_expiring rows in the panel's 30-day window.
      required:
        - employmentId
        - employeeName
        - employeeNo
        - orgName
        - endDate
        - daysRemaining
      properties:
        employmentId:
          type: integer
        employeeName:
          type: string
        employeeNo:
          type: string
        orgName:
          type: string
        endDate:
          type: string
          format: date
        daysRemaining:
          type: integer
          minimum: 0
          maximum: 30
    DashboardData:
      type: object
      required:
        - asOf
        - freshness
        - greeting
        - metrics
        - pendingApprovals
        - recentNotices
        - contractAlerts
      properties:
        asOf:
          type: string
          format: date
        freshness:
          type: string
          format: date-time
        greeting:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMetric"
        pendingApprovals:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/DashboardPendingApproval"
        recentNotices:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/DashboardNotice"
        contractAlerts:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/DashboardContractAlert"
    Pagination:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    Paginated:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    EmploymentSnapshot:
      type: object
      required:
        - employment_id
        - person_id
        - legal_entity_id
        - employee_no
        - status
        - current_assignment
        - manager_employment_id
      properties:
        employment_id:
          type: integer
        person_id:
          type: integer
        person_name:
          type:
            - string
            - "null"
        employee_no:
          type: string
        legal_entity_id:
          type: integer
        status:
          type: string
          enum:
            - PROBATION
            - ACTIVE
            - LEAVE
            - SUSPENDED
            - TERMINATED
        employment_type:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - FIXED_TERM
            - INTERN
            - CONTRACTOR
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        current_assignment:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Assignment"
        manager_employment_id:
          type:
            - integer
            - "null"
    Assignment:
      type: object
      required:
        - id
        - employment_id
        - org_unit_id
        - assignment_type
        - is_primary
        - valid_from
        - valid_to
      properties:
        id:
          type: integer
        employment_id:
          type: integer
        org_unit_id:
          type: integer
        position_id:
          type:
            - integer
            - "null"
        manager_assignment_id:
          type:
            - integer
            - "null"
        assignment_type:
          type: string
          enum:
            - PRIMARY
            - SECONDMENT
            - MATRIX
            - PROJECT
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    Terms:
      type: object
      properties:
        id:
          type: integer
        employment_id:
          type: integer
        version:
          type: integer
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        work_location:
          type: string
        work_schedule:
          type: string
        salary_scheme_code:
          type:
            - string
            - "null"
        notice_period_days:
          type: integer
        confidentiality:
          type: boolean
        non_compete:
          type: boolean
        probation_end_date:
          type:
            - string
            - "null"
          format: date
    Person:
      type: object
      required:
        - id
        - legal_name
      properties:
        id:
          type: integer
        legal_name:
          type: string
        preferred_name:
          type:
            - string
            - "null"
        birth_date:
          type:
            - string
            - "null"
          format: date
        gender:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        mobile:
          type:
            - string
            - "null"
          description: Masked for P1 callers. Identity numbers are never serialized.
    OrgUnit:
      type: object
      required:
        - id
        - legal_entity_id
        - code
        - name
        - type
      properties:
        id:
          type: integer
        legal_entity_id:
          type: integer
        parent_id:
          type:
            - integer
            - "null"
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - COMPANY
            - DIVISION
            - DEPARTMENT
            - TEAM
            - COST_CENTER
            - SHARED_SERVICE
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    PersonCreate:
      type: object
      required:
        - legal_name
      properties:
        legal_name:
          type: string
          maxLength: 120
        preferred_name:
          type:
            - string
            - "null"
          maxLength: 120
        id_type:
          type:
            - string
            - "null"
          maxLength: 32
        id_number:
          type:
            - string
            - "null"
          maxLength: 128
          writeOnly: true
        birth_date:
          type:
            - string
            - "null"
          format: date
        gender:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
          minLength: 2
          maxLength: 2
        mobile:
          type:
            - string
            - "null"
          writeOnly: true
        email:
          type:
            - string
            - "null"
          format: email
    EmploymentCreate:
      type: object
      required:
        - person_id
        - legal_entity_id
        - employee_no
        - employment_type
        - valid_from
        - hire_date
      properties:
        person_id:
          type: integer
        legal_entity_id:
          type: integer
        employee_no:
          type: string
          maxLength: 64
        employment_type:
          type: string
          enum:
            - FULL_TIME
            - PART_TIME
            - FIXED_TERM
            - INTERN
            - CONTRACTOR
        status:
          type: string
          enum:
            - PROBATION
            - ACTIVE
            - LEAVE
            - SUSPENDED
            - TERMINATED
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
        hire_date:
          type: string
          format: date
        termination_date:
          type:
            - string
            - "null"
          format: date
        seniority_start_date:
          type:
            - string
            - "null"
          format: date
    AssignmentCreate:
      type: object
      required:
        - org_unit_id
        - assignment_type
        - valid_from
      properties:
        org_unit_id:
          type: integer
        position_id:
          type:
            - integer
            - "null"
        manager_assignment_id:
          type:
            - integer
            - "null"
        assignment_type:
          type: string
          enum:
            - PRIMARY
            - SECONDMENT
            - MATRIX
            - PROJECT
        is_primary:
          type: boolean
        valid_from:
          type: string
          format: date
        valid_to:
          type: string
          format: date
    TermsCreate:
      type: object
      required:
        - effective_from
        - work_location
        - work_schedule
      properties:
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        probation_end_date:
          type:
            - string
            - "null"
          format: date
        work_location:
          type: string
        work_schedule:
          type: string
        salary_scheme_code:
          type:
            - string
            - "null"
        notice_period_days:
          type: integer
          minimum: 0
        confidentiality:
          type: boolean
        non_compete:
          type: boolean
        signed_at:
          type:
            - string
            - "null"
          format: date-time
    DocumentCreate:
      type: object
      required:
        - file_object_id
        - category
        - retention_class
      properties:
        file_object_id:
          type: integer
        category:
          type: string
          enum:
            - CONTRACT
            - ID
            - EDUCATION
            - CERTIFICATE
            - OTHER
        signed_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date
        retention_class:
          type: string
          maxLength: 32
        legal_hold:
          type: boolean
    OrgUnitCreate:
      type: object
      required:
        - legal_entity_id
        - code
        - name
        - type
      properties:
        legal_entity_id:
          type: integer
        parent_id:
          type:
            - integer
            - "null"
        code:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 160
        type:
          type: string
          enum:
            - COMPANY
            - DIVISION
            - DEPARTMENT
            - TEAM
            - COST_CENTER
            - SHARED_SERVICE
        valid_from:
          type:
            - string
            - "null"
          format: date
        valid_to:
          type:
            - string
            - "null"
          format: date
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - request_id
      properties:
        code:
          type: string
          examples:
            - FORBIDDEN
        message:
          type: string
        data:
          type: object
          additionalProperties: true
        request_id:
          type: string
    HealthData:
      type: object
      required:
        - status
        - version
        - checks
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        version:
          type: string
        checks:
          type: object
          required:
            - db
            - cache
            - storage
          properties:
            db:
              type: boolean
            cache:
              type: boolean
            storage:
              type: boolean
        time:
          type: string
          format: date-time
    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
