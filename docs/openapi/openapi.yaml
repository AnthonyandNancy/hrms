        - orgUnitIds
        - roleCodes
        - recipientUserIds
        - recipientCount
        - resolvedOn
      properties:
        notice_id:
          type: integer
        audienceType:
          type: string
          enum:
            - ALL
            - ORG
            - ROLE
        audienceLabel:
          type: string
        orgUnitIds:
          type: array
          items:
            type: integer
        roleCodes:
          type: array
          items:
            type: string
        recipientUserIds:
          type: array
          items:
            type: integer
        recipientCount:
          type: integer
          minimum: 0
        resolvedOn:
          type: string
          format: date
    NoticeTemplate:
      type: object
