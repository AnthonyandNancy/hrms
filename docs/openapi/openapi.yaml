                                    - ABSENT
                                    - LEAVE
                                    - REST
                                    - HOLIDAY
                                    - EARLY
                                    - INCOMPLETE
                                scheduledStart:
                                  type:
                                    - string
                                    - "null"
                                scheduledEnd:
                                  type:
                                    - string
                                    - "null"
                                firstIn:
                                  type:
                                    - string
                                    - "null"
                                lastOut:
                                  type:
                                    - string
                                    - "null"
                                workedMinutes:
                                  type: integer
                                exceptionLabel:
                                  type:
                                    - string
                                    - "null"
                                scheduled_minutes:
                                  type: integer
                          summary:
                            type: object
                            properties:
                              expectedDays:
                                type: integer
                              presentDays:
                                type: integer
                              lateCount:
                                type: integer
                              absentCount:
                                type: integer
                              leaveDays:
                                type: integer
                              remoteDays:
                                type: integer
                          exceptions:
                            type: array
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  format: date
                                status:
                                  type: string
                                exceptionLabel:
                                  type:
                                    - string
