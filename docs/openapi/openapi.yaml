  /v1/time/attendance/rules:
    get:
      operationId: timeAttendanceRulesIndex
      tags:
        - Time
      summary: List effective-dated attendance rule versions
      description: |
        Returns every stored rule version newest first plus `is_effective` for the
        requested business date. History is append-only; publishing a version
        never rewrites an earlier row. Requires capability
        `time.attendance.rule.read`.
      parameters:
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: Attendance rule versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Pagination"
                          - type: object
                            required:
                              - items
                              - total
                              - as_of
                              - freshness
                              - source_hash
                            properties:
                              as_of:
                                type: string
                                format: date
                              freshness:
                                type: string
                                enum:
                                  - LIVE
                                  - MATERIALIZED
                                  - STALE
                              source_hash:
                                type: string
                              items:
                                type: array
                                items:
                                  $ref: "#/components/schemas/AttendanceRuleVersion"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: time.attendance.rule.read
    post:
      operationId: timeAttendanceRulesPublish
      tags:
        - Time
      summary: Publish a new effective-dated attendance rule version
      description: |
        Append-only publish. Re-publishing an identical version is an idempotent
        replay; re-using a version string with a different definition returns 409
        `RULE_VERSION_IMMUTABLE`. Requires capability
        `time.attendance.rule.manage`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
                - effective_from
                - config
              properties:
                version:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: ^[A-Za-z0-9._-]+$
                effective_from:
                  type: string
                  format: date
                config:
                  $ref: "#/components/schemas/AttendanceRuleConfig"
      responses:
        "201":
          description: Rule version published or replayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/AttendanceRuleVersion"
                          - type: object
                            required:
                              - replayed
                            properties:
                              replayed:
                                type: boolean
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: time.attendance.rule.manage
      x-action-label: 发布考勤规则
