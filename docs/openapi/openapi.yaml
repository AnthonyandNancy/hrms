  /v1/cases:
    get:
      operationId: workflowCasesIndex
      tags:
        - Workflow
      summary: List cases visible to the caller
      description: >
        Returns cases visible through the caller's requester, task-assignee or
        decision-actor membership. `view=my_approvals` returns cases with a
        pending task assigned to the caller; `view=my_decided` returns cases
        where the caller has recorded a decision; `view=my_requests` returns
        cases the caller created. A single `type` filter is supported. Callers
        that need several case types issue one bounded query per type because
        there is deliberately no multi-value `type[]` parameter.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: view
          in: query
          schema:
            type: string
            enum: [my_approvals, my_decided, my_requests]
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, IN_REVIEW, APPROVED, REJECTED, WITHDRAWN, CANCELLED]
        - name: effect_status
          in: query
          schema:
            type: string
            enum: [NONE, PENDING, SCHEDULED, APPLIED, PARTIAL, FAILED, REVERSED]
        - name: type
          in: query
          description: One business case type, e.g. LEAVE_REQUEST or ASSIGNMENT_CHANGE.
          schema:
            type: string
            maxLength: 64
        - name: business_date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Case page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CasePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: workflow.case.read
    post:
      operationId: workflowCasesStore
      tags:
        - Workflow
      summary: Create a case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - subject_type
                - title
                - template_id
                - business_date
              properties:
                type:
                  type: string
                subject_type:
                  type: string
                subject_id:
                  type:
                    - integer
                    - "null"
                title:
                  type: string
                template_id:
                  type: integer
                business_date:
                  type: string
                  format: date
                payload:
                  type: object
                submit:
                  type: boolean
      responses:
        "201":
          description: Case created or replayed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CaseCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
      x-capability: workflow.case.create
      x-action-label: 发起审批事项
  /v1/cases/{caseId}/decisions:
    post:
      operationId: workflowDecisionsStore
      tags:
        - Workflow
      summary: Append an immutable decision
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      description: >
        Appends one immutable decision. The action is one of APPROVE, REJECT or
        RETURN for an assigned approver; WITHDRAW, DELEGATE and CC remain
        supported workflow actions. Replaying the same Idempotency-Key and
        payload returns the stored 200 response with `Idempotency-Replayed:
        true`; reusing a key with a different payload returns 409. A decision
        on a case that is no longer pending returns 409, and a caller without a
        pending task for the case receives 404 so case existence is not leaked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, RETURN, WITHDRAW, DELEGATE, CC]
                comment:
                  type: string
                  maxLength: 4000
                target_user_id:
                  type:
                    - integer
                    - "null"
                reason:
                  type:
                    - string
                    - "null"
                  maxLength: 2000
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Immutable decision appended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DecisionResult"
      x-capability: workflow.case.decide
      x-action-label: 提交审批决定
