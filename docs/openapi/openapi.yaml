    post:
      operationId: timeOvertimeRequestsStore
      tags:
        - Time
      summary: Declare overtime for the caller employment
      description: |
        Stores `declared_minutes` only. Actual minutes are recorded by the
        separate confirmation command; an omitted or blank Idempotency-Key is
        rejected with 422.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_date, declared_minutes, reason]
              properties:
                business_date: { type: string, format: date }
                declared_minutes: { type: integer, minimum: 1, maximum: 10080 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201":
          description: Overtime request created
          headers:
            Idempotency-Replayed:
              description: Present and true when a completed request was replayed.
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OvertimeRequest"
        "200":
          description: Idempotent replay of the original creation
          headers:
            Idempotency-Replayed:
              description: Always true on a replay.
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OvertimeRequest"
        "401":
