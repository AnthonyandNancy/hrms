    post:
      operationId: lifecycleSecondmentStore
      tags:
        - Lifecycle
      summary: Start a secondment as a parallel SECONDMENT assignment
      description: |
        Requires capability `lifecycle.secondment.manage` and an Idempotency-Key.
        The command appends an Assignment with assignment_type SECONDMENT; the
        primary assignment row is never rewritten. Overlapping secondments and
        secondments without an active primary assignment are 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employment_id
                - host_org_unit_id
                - effective_from
                - effective_to
                - reason
              properties:
                employment_id:
                  type: integer
                  minimum: 1
                host_org_unit_id:
                  type: integer
                  minimum: 1
                position_id:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                effective_from:
                  type: string
                  format: date
                effective_to:
                  type: string
                  format: date
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        "201":
          description: Secondment assignment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SecondmentAssignment"
