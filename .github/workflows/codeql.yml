name: SAST

# Plan 2.4 requires the security gate to cover dependency audit + secret scan +
# SAST. Dependency audit lives in security.yml (composer audit) and the secret
# scan is gitleaks there; this workflow is the SAST third of that gate.
#
# CodeQL runs on GitHub-hosted runners only. It does not prove a local scan ran,
# and evidence/acceptance-report.md records it as an environment gate rather
# than as a local pass.

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
